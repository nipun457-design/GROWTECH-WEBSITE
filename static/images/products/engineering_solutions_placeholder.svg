<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    <pattern id="dotPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#cbd5e1" />
    </pattern>
  </defs>

  <!-- Technical Background -->
  <rect width="800" height="520" fill="#f8fafc"/>
  <rect width="800" height="520" fill="url(#gridPattern)"/>
  <rect width="800" height="520" fill="url(#dotPattern)" opacity="0.6"/>

  <!-- Industrial Framing -->
  <rect x="16" y="16" width="768" height="488" fill="none" stroke="#0b3866" stroke-width="2" stroke-opacity="0.3"/>
  <rect x="24" y="24" width="752" height="472" fill="none" stroke="#198754" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Corner Alignment Crosshairs -->
  <g stroke="#0b3866" stroke-width="1.5">
    <line x1="12" y1="16" x2="26" y2="16"/>
    <line x1="16" y1="12" x2="16" y2="26"/>
    <line x1="774" y1="16" x2="788" y2="16"/>
    <line x1="784" y1="12" x2="784" y2="26"/>
    <line x1="12" y1="504" x2="26" y2="504"/>
    <line x1="16" y1="494" x2="16" y2="508"/>
    <line x1="774" y1="504" x2="788" y2="504"/>
    <line x1="784" y1="494" x2="784" y2="508"/>
  </g>

  <!-- Top Technical Header Bar -->
  <rect x="36" y="36" width="728" height="34" fill="#0b3866" rx="2"/>
  <text x="50" y="58" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">GROWTECH ENGINEERS • INDUSTRIAL SPECIFICATION ARCHIVE</text>
  <rect x="630" y="43" width="120" height="20" fill="#198754" rx="2"/>
  <text x="690" y="57" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">CATEGORY: ENG-06</text>

  <!-- Main Illustration / Schematic Symbol -->
  <g transform="translate(0, 0)">
    
        <!-- Engineering Compass / CAD Grid -->
        <circle cx="400" cy="180" r="40" fill="none" stroke="#0b3866" stroke-width="3"/>
        <line x1="400" y1="130" x2="400" y2="230" stroke="#198754" stroke-width="2" stroke-dasharray="4,3"/>
        <line x1="350" y1="180" x2="450" y2="180" stroke="#198754" stroke-width="2" stroke-dasharray="4,3"/>
        <polygon points="400,145 425,225 375,225" fill="none" stroke="#0b3866" stroke-width="3"/>
        <circle cx="400" cy="145" r="5" fill="#dc3545"/>
        
  </g>

  <!-- Center Focal Box -->
  <rect x="60" y="325" width="680" height="105" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="4"/>
  <rect x="60" y="325" width="6" height="105" fill="#198754" rx="2"/>

  <!-- Title & Subtitle -->
  <text x="85" y="360" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#0b3866">Plant Engineering &amp; Process Optimization</text>
  <text x="85" y="385" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#475569">Capacity Enhancement, Layout Planning, Kaizen &amp; Poka-Yoke Tooling Upgrades</text>
  <text x="85" y="412" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#198754">MANESAR FACILITY • GROWTECH PRECISION STANDARDS</text>

  <!-- Technical Watermark / Compliance Notice -->
  <rect x="36" y="464" width="728" height="28" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="52" cy="478" r="4" fill="#0b3866"/>
  <text x="66" y="482" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="0.5">NOTICE: TEMPORARY TECHNICAL PLACEHOLDER — ACTUAL UNIT PHOTO TO BE UPLOADED BY OWNER</text>
  <text x="750" y="482" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#0b3866" text-anchor="end">GE-PLH-2024</text>
</svg>