{% extends "base.html" %}

{% block title %}400 - Bad Request | GROWTECH ENGINEERS{% endblock %}

{% block content %}
<section class="py-5 bg-light min-vh-50 d-flex align-items-center">
  <div class="container py-5 text-center">
    <div class="card p-5 border shadow-sm mx-auto bg-white" style="max-width: 650px;">
      <div class="text-navy display-1 fw-bold mb-3"><i class="bi bi-question-circle-fill text-warning"></i> 400</div>
      <h2 class="h3 text-navy mb-3">Bad Request</h2>
      <p class="text-secondary mb-4">
        The server could not understand the request due to invalid syntax or an expired session.
      </p>
      <div class="d-flex justify-content-center gap-3 flex-wrap">
        <a href="{{ url_for('home') }}" class="btn btn-gt-primary">
          <i class="bi bi-house-door-fill me-1"></i> Return to Homepage
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
