# ==============================================================================
# Render Blueprint Specification for GROWTECH ENGINEERS Corporate Web Platform
# 100% Free Tier Architecture (Render Free Web Service + Supabase Free PostgreSQL & Storage)
# Total Cost: ₹0 / month (No credit card or paid resources required)
# https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: growtech-engineers-web
    runtime: python
    buildCommand: "pip install -r requirements.txt && python migrate_phase2.py"
    startCommand: "gunicorn app:app --workers 2 --threads 4 --timeout 120"
    plan: free
    region: singapore
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: growtech-uploads
